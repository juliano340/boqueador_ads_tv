<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Boqueador — Configurações</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 780px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    .site { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .site header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .site h2 { font-size: 14px; margin: 0; word-break: break-all; }
    .site .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .site .actions label { font-size: 12px; display: flex; gap: 4px; align-items: center; }
    button { padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #f7f7f7; border-radius: 4px; font-size: 12px; }
    button.danger { background: #fee; border-color: #d99; color: #a22; }
    ul { list-style: none; padding: 0; margin: 8px 0 0; }
    li { display: flex; gap: 6px; align-items: center; padding: 4px 0; font-size: 12px; }
    li code { flex: 1; background: #fafafa; padding: 2px 6px; border-radius: 3px; word-break: break-all; }
    .tag { flex: 0 0 auto; font-size: 9px; font-weight: 600; text-transform: uppercase; padding: 2px 5px; border-radius: 3px; background: #eee; color: #555; }
    .tag.paint { background: #222; color: #fff; }
    .add { display: flex; gap: 6px; margin-top: 8px; }
    .add input { flex: 1; padding: 4px 6px; font-size: 12px; }
    .add select { padding: 4px 6px; font-size: 12px; }
    .empty { color: #888; font-size: 12px; }
    .new-site { margin-top: 16px; display: flex; gap: 6px; }
    .new-site input { flex: 1; padding: 6px 8px; }
  </style>
</head>
<body>
  <h1>Boqueador — sites configurados</h1>
  <div id="sites"></div>
  <div class="new-site">
    <input id="new-host" placeholder="exemplo.com" />
    <button id="add-host">Adicionar site</button>
  </div>
  <script src="options.js"></script>
</body>
</html>
